name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: "true"
      CLIENT_CLERK_PUBLIC_KEY: ${{ vars.CLIENT_CLERK_PUBLIC_KEY }}
      CLIENT_FINANCE_APP_URL: ${{ vars.CLIENT_FINANCE_APP_URL }}
      CLIENT_API_BASE_URL: ${{ vars.CLIENT_API_BASE_URL }}
      CLIENT_API_MODE: live
      CLIENT_API_SANDBOX: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm run install:safe
      - name: Build finance remote
        env:
          NODE_OPTIONS: --require ts-node/register
        run: npx nx run @power/finance:build --skip-nx-cache
      - name: Build shell host
        env:
          NODE_OPTIONS: --require ts-node/register
        run: npx nx run @power/shell:build --skip-nx-cache
      - name: Deploy finance to manage.powerfinance.site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy services/finance/dist --project-name=power-finance-manage --branch=main --commit-dirty=true
      - name: Deploy shell to powerfinance.site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy services/shell/dist --project-name=power-finance-shell --branch=main --commit-dirty=true
